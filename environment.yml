# Isolated conda environment for the IPF transcriptomic framework.
# Create with:   conda env create -f environment.yml
# Activate with: conda activate ipffx
name: ipffx
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.13
  - statsmodels>=0.14
  - pyyaml>=6.0
  - scikit-learn>=1.3
  - streamlit>=1.30
  - anndata>=0.10
  - scanpy>=1.9
  - h5py>=3.9
  - openpyxl>=3.1
  - requests>=2.31
  - pip
  - pip:
      - GEOparse>=2.0.4        # optional: programmatic GEO download
