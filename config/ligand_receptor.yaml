# Curated ligand-receptor axes for focused prioritization in IPF.
# Mirrors the reference framework's focused (not exhaustive) L-R approach:
# each axis is scored by disease-associated expression of the ligand, plausible
# sender/receiver compartments and curated pathway membership. This is NOT
# CellChat/CellPhoneDB/NicheNet inference.

axes:
